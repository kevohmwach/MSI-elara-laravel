version: '3.8'

services:
  # === PHP-FPM Application Layer ===
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gradestar-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:rhpAbp4fD6AHsYXGNf0KtqU3RcM1UzcJ3G1Gma+yAmE= # Use your actual app key locally
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=gradestar_local
      - DB_USERNAME=gradestar_user
      - DB_PASSWORD=secret_local_pass
      - APP_URL=http://localhost:8080
    volumes:
      # Named volume to share compiled code/assets with Nginx
      - app-code:/var/www
    depends_on:
      - db

  # === Nginx Web Proxy Layer ===
  web:
    image: nginx:alpine
    container_name: gradestar-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Share the application code from the 'app' container
      - app-code:/var/www
      # Mount our custom local Nginx configuration
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # === MySQL Database Layer ===
  db:
    image: mysql:8.0
    container_name: gradestar-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gradestar_local
      MYSQL_USER: gradestar_user
      MYSQL_PASSWORD: secret_local_pass
      MYSQL_ROOT_PASSWORD: root_secret_pass
      MYSQL_ROOT_HOST: '%' # Allows root or root-level operations across docker subnets
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  app-code:
  db-data: